<svg viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
    <rect width="1400" height="680" fill="#0d1117"/>

  <!-- Lane labels -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#2f81f4">CI: build &amp; publish</text>
  <text x="270" y="385" font-size="20" font-weight="700" fill="#a371f7">IaC: provision &amp; deploy</text>

  <!-- Developer -->
  <rect x="40" y="230" width="160" height="90" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="120" y="270" font-size="20" font-weight="700" text-anchor="middle" fill="#e6edf3">Developer</text>
  <text x="120" y="296" font-size="16" text-anchor="middle" fill="#8b949e">source code</text>

  <!-- GitHub -->
  <rect x="270" y="90" width="220" height="100" rx="12" fill="#161b22" stroke="#2f81f4" stroke-width="2"/>
  <text x="380" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="#e6edf3">GitHub</text>
  <text x="380" y="158" font-size="17" text-anchor="middle" fill="#adbac7">repo + Actions workflow</text>

  <!-- Docker Hub -->
  <rect x="540" y="90" width="200" height="100" rx="12" fill="#161b22" stroke="#2f81f4" stroke-width="2"/>
  <text x="640" y="130" font-size="20" font-weight="700" text-anchor="middle" fill="#e6edf3">Docker Hub</text>
  <text x="640" y="158" font-size="17" text-anchor="middle" fill="#adbac7">3 versioned images</text>

  <!-- Terraform -->
  <rect x="270" y="400" width="220" height="100" rx="12" fill="#1c1633" stroke="#a371f7" stroke-width="2"/>
  <text x="380" y="440" font-size="20" font-weight="700" text-anchor="middle" fill="#e6edf3">Terraform</text>
  <text x="380" y="468" font-size="17" text-anchor="middle" fill="#adbac7">init · plan · apply</text>

  <!-- Azure -->
  <rect x="790" y="40" width="440" height="610" rx="16" fill="#0d1117" stroke="#2f81f4" stroke-width="3"/>
  <text x="810" y="72" font-size="18" font-weight="700" fill="#2f81f4">Azure · Resource Group</text>
  <rect x="810" y="90" width="400" height="400" rx="12" fill="#0d1117" stroke="#a371f7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="826" y="116" font-size="17" font-weight="700" fill="#a371f7">Container Apps Environment</text>

  <rect x="830" y="140" width="360" height="80" rx="10" fill="#161b22" stroke="#2f81f4" stroke-width="2"/>
  <text x="1010" y="175" font-size="18" font-weight="700" text-anchor="middle" fill="#e6edf3">Frontend (React)</text>
  <text x="1010" y="199" font-size="15" text-anchor="middle" fill="#adbac7">public ingress · port 80</text>

  <rect x="830" y="300" width="170" height="90" rx="10" fill="#161b22" stroke="#2f81f4" stroke-width="2"/>
  <text x="915" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Product API</text>
  <text x="915" y="359" font-size="15" text-anchor="middle" fill="#adbac7">ingress · port 3001</text>

  <rect x="1020" y="300" width="170" height="90" rx="10" fill="#161b22" stroke="#2f81f4" stroke-width="2"/>
  <text x="1105" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Order API</text>
  <text x="1105" y="359" font-size="15" text-anchor="middle" fill="#adbac7">ingress · port 3002</text>

  <rect x="810" y="530" width="400" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="1010" y="566" font-size="18" font-weight="700" text-anchor="middle" fill="#e6edf3">Log Analytics (logs)</text>

  <!-- Browser -->
  <rect x="1280" y="130" width="100" height="90" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="1330" y="170" font-size="18" font-weight="700" text-anchor="middle" fill="#e6edf3">Browser</text>
  <text x="1330" y="194" font-size="15" text-anchor="middle" fill="#8b949e">user</text>

  <!-- Arrows: CI -->
  <line x1="200" y1="250" x2="268" y2="160" stroke="#2f81f4" stroke-width="3"/>
  <polygon points="268.0,160.0 254.0,167.0 265.1,175.4" fill="#2f81f4"/>
  <text x="130" y="205" font-size="17" font-weight="700" fill="#2f81f4">1 git push</text>
  <line x1="490" y1="140" x2="538" y2="140" stroke="#2f81f4" stroke-width="3"/>
  <polygon points="538.0,140.0 524.0,133.0 524.0,147.0" fill="#2f81f4"/>
  <text x="515" y="212" font-size="16" font-weight="700" text-anchor="middle" fill="#2f81f4">2 docker build + push</text>

  <!-- Arrows: IaC -->
  <line x1="200" y1="300" x2="268" y2="430" stroke="#a371f7" stroke-width="3"/>
  <polygon points="268.0,430.0 267.7,414.4 255.3,420.8" fill="#a371f7"/>
  <text x="70" y="400" font-size="17" font-weight="700" fill="#a371f7">3 az login +</text>
  <text x="70" y="418" font-size="17" font-weight="700" fill="#a371f7">terraform apply</text>
  <line x1="490" y1="450" x2="788" y2="450" stroke="#a371f7" stroke-width="3"/>
  <polygon points="788.0,450.0 774.0,443.0 774.0,457.0" fill="#a371f7"/>
  <text x="640" y="438" font-size="17" font-weight="700" text-anchor="middle" fill="#a371f7">4 creates infrastructure</text>

  <!-- Docker Hub -> Azure pull -->
  <line x1="740" y1="140" x2="828" y2="175" stroke="#2f81f4" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="828.0,175.0 817.6,163.3 812.4,176.3" fill="#2f81f4"/>
  <text x="545" y="72" font-size="17" font-weight="700" fill="#2f81f4">5 Azure pulls images</text>

  <!-- Frontend -> APIs -->
  <line x1="940" y1="222" x2="915" y2="298" stroke="#8b949e" stroke-width="2.5"/>
  <polygon points="915.0,298.0 926.0,286.9 912.7,282.5" fill="#8b949e"/>
  <line x1="1080" y1="222" x2="1105" y2="298" stroke="#8b949e" stroke-width="2.5"/>
  <polygon points="1105.0,298.0 1107.3,282.5 1094.0,286.9" fill="#8b949e"/>
  <text x="1010" y="262" font-size="15" text-anchor="middle" fill="#8b949e">REST calls (HTTPS)</text>

  <!-- Browser -> Frontend -->
  <line x1="1278" y1="175" x2="1192" y2="180" stroke="#8b949e" stroke-width="3"/>
  <polygon points="1192.0,180.0 1206.4,186.2 1205.6,172.2" fill="#8b949e"/>
  <text x="1290" y="245" font-size="17" font-weight="700" fill="#8b949e">6 open the</text>
  <text x="1290" y="263" font-size="17" font-weight="700" fill="#8b949e">live URL</text>

  <!-- Legend -->
  <rect x="40" y="590" width="14" height="14" fill="#2f81f4"/><text x="62" y="602" font-size="16" fill="#adbac7">CI / image flow</text>
  <rect x="200" y="590" width="14" height="14" fill="#a371f7"/><text x="222" y="602" font-size="16" fill="#adbac7">Infrastructure as code</text>
  <rect x="400" y="590" width="14" height="14" fill="#8b949e"/><text x="422" y="602" font-size="16" fill="#adbac7">Runtime traffic</text>
</svg>
